server:
  port: 8085

spring:
  application:
    name: eshop-order
  # 敏感口令统一从项目根 application-local.yml 注入（该文件已被 .gitignore 排除，不随仓库分发）
  config:
    import: optional:file:./application-local.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
        port: 8720
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shop_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ：超时关单延迟消息（P2）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: eshop-order-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# Sentinel：Feign 调用熔断降级（P2；规则见 SentinelDegradeConfig，Dashboard 见 spring.cloud.sentinel）
feign:
  sentinel:
    enabled: true

eshop:
  mq:
    # 延迟级别（1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h → 1..18）
    # 生产语义 16 = 30 分钟；本地演示可加启动参数 --eshop.mq.order-timeout-delay-level=3（10 秒）快速验证
    order-timeout-delay-level: 16

# Seata AT 全局事务（P2）：TM/RM 从 Nacos 发现 TC（seata-server 注册名）；XID 经 Feign 头自动传播
seata:
  enabled: true
  # 事务服务分组（与 TC 的 cluster=default 通过 vgroup-mapping 对应）
  tx-service-group: eshop_tx_group
  service:
    vgroup-mapping:
      eshop_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      # Nacos 认证账号由项目根 application-local.yml 注入
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}

springdoc:
  api-docs:
    enabled: true

knife4j:
  enable: true

logging:
  level:
    com.eshop: debug
