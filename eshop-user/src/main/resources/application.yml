server:
  port: 8081

spring:
  application:
    name: eshop-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shop_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

eshop:
  jwt:
    # 本地开发密钥（HS256 要求 ≥ 32 字节）；须与 eshop-gateway 保持一致；生产移入配置中心并更换
    secret: eshop-2026-dev-only-jwt-secret-key-ChangeMeInProduction!
    expire-seconds: 7200

springdoc:
  api-docs:
    enabled: true

knife4j:
  enable: true

logging:
  level:
    com.eshop: debug
